<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">microLED-driven maskless in situ synthesis</title><desc id="desc">Addressable microLED pixels illuminate selected synthesis sites. Light removes protecting groups, nucleotide coupling extends probes, and the cycle repeats to create a designed probe array.</desc>

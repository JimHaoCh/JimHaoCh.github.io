media:
- name: images
  label: 照片與圖片
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
  - image
  extensions:
  - png
  - jpg
  - jpeg
  - webp
- name: documents
  label: 課程講義檔案
  input: assets/handouts
  output: /assets/handouts
  rename: safe
  extensions:
  - pdf
  - pptx
  - ppt
  - docx
  - zip
content:
- name: courses
  label: 課程講義
  type: file
  path: _data/courses.json
  format: json
  list: true
  fields:
  - name: title
    label: 中文課程名稱
    type: string
    required: true
  - name: title_en
    label: 英文課程名稱
    type: string
  - name: code
    label: 課號
    type: string
  - name: year
    label: 學年度
    type: string
    description: 例如：115。相同課程於不同學期請建立新項目。
  - name: semester
    label: 學期
    type: select
    options:
      values:
      - name: '1'
        label: 上學期 / Fall
      - name: '2'
        label: 下學期 / Spring
      - name: summer
        label: 暑期 / Summer
  - name: description
    label: 中文課程簡介
    type: text
  - name: description_en
    label: 英文課程簡介
    type: text
  - name: materials
    label: 講義與學習資源
    type: object
    list: true
    fields:
    - name: title
      label: 中文單元名稱
      type: string
      required: true
    - name: title_en
      label: 英文單元名稱
      type: string
    - name: week
      label: 週次
      type: number
    - name: updated
      label: 更新日期
      type: date
      options:
        format: yyyy-MM-dd
    - name: file
      label: 上傳講義
      type: file
      options:
        media: documents
        extensions:
        - pdf
        - pptx
        - ppt
        - docx
        - zip
      description: 上傳公開教材。若同時填寫外部連結，網站優先使用此檔案。
    - name: url
      label: 外部資源連結
      type: string
      description: 使用 https:// 開頭的完整網址。適用雲端教材或校務平台。
    - name: published
      label: 在網站顯示
      type: boolean
      default: true
      description: 此開關控制頁面顯示。已上傳的公開檔案仍可透過原網址存取。
  - name: published
    label: 在網站顯示
    type: boolean
    default: true
    description: 此開關控制頁面顯示。已上傳的公開檔案仍可透過原網址存取。
- name: news
  label: 最新消息
  type: file
  path: _data/news.json
  format: json
  fields:
  - &id001
    name: title
    label: 中文標題
    type: string
    required: true
  - &id002
    name: title_en
    label: 英文標題
    type: string
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - &id003
    name: body
    label: 中文內容
    type: rich-text
    options:
      format: html
      switcher: false
      media: images
  - &id004
    name: body_en
    label: 英文內容
    type: rich-text
    options:
      format: html
      switcher: false
      media: images
  - &id005
    name: image
    label: 封面照片
    type: image
    options:
      media: images
  - &id006
    name: image_alt
    label: 照片說明 / 替代文字
    type: string
  - name: icon
    label: 裝飾圖示
    type: select
    options: &id007
      values:
      - name: microfluidic-chip
        label: 微流體晶片 / Microfluidic chip
      - name: droplet
        label: 液滴 / Droplet
      - name: dna
        label: 核酸 / DNA
      - name: cell
        label: 細胞 / Cell
      - name: bacterium
        label: 細菌 / Bacterium
      - name: antibody
        label: 抗體 / Antibody
      - name: pipette
        label: 移液操作 / Pipette
      - name: flask
        label: 實驗方法 / Flask
      - name: microscope
        label: 顯微鏡 / Microscope
      - name: syringe-pump
        label: 針筒泵浦 / Syringe pump
      - name: biosensor
        label: 生物感測器 / Biosensor
      - name: droplet-junction
        label: 液滴產生 / Droplet junction
      - name: document
        label: 論文與文件 / Document
      - name: chart
        label: 結果與圖表 / Chart
      - name: target
        label: 研究目標 / Target
      - name: idea
        label: 構想與展望 / Idea
      - name: gear
        label: 設備與設定 / Gear
      - name: team
        label: 研究團隊 / Team
      - name: globe
        label: 網站與國際合作 / Globe
      - name: email
        label: 聯絡信箱 / Email
      - name: link
        label: 連結 / Link
      - name: calendar
        label: 時程與活動 / Calendar
      - name: validation
        label: 驗證與結論 / Validation
      - name: search
        label: 背景與問題 / Search
  - &id008
    name: published
    label: 在網站顯示
    type: boolean
    default: true
    description: 開啟後，此項目會出現在公開網站。
  list: true
- name: instruments
  label: 實驗儀器
  type: file
  path: _data/instruments.json
  format: json
  fields:
  - *id001
  - *id002
  - name: model
    label: 型號 / Model
    type: string
  - *id003
  - *id004
  - *id005
  - *id006
  - name: icon
    label: 裝飾圖示
    type: select
    options: *id007
  - *id008
  list: true
- name: moments
  label: 生活剪影
  type: file
  path: _data/moments.json
  format: json
  fields:
  - *id001
  - *id002
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - *id003
  - *id004
  - *id005
  - *id006
  - name: icon
    label: 裝飾圖示
    type: select
    options: *id007
  - *id008
  list: true
- name: techniques
  label: 技術簡介
  type: file
  path: _data/techniques.json
  format: json
  fields:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - name: icon

media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
  - image
  extensions:
  - png
  - jpg
  - jpeg
  - webp
content:
- name: news
  label: 最新消息
  type: file
  path: _data/news.json
  format: json
  fields:
  - &id001
    name: title
    label: 中文標題
    type: string
    required: true
  - &id002
    name: title_en
    label: 英文標題
    type: string
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - &id003
    name: body
    label: 中文內容
    type: rich-text
    options:
      format: html
      switcher: false
  - &id004
    name: body_en
    label: 英文內容
    type: rich-text
    options:
      format: html
      switcher: false
  - &id005
    name: image
    label: 封面照片
    type: image
  - &id006
    name: image_alt
    label: 照片說明 / 替代文字
    type: string
  - &id007
    name: published
    label: 在網站顯示
    type: boolean
    default: true
    description: 開啟後，此項目會出現在公開網站。
  list: true
- name: instruments
  label: 實驗儀器
  type: file
  path: _data/instruments.json
  format: json
  fields:
  - *id001
  - *id002
  - name: model
    label: 型號 / Model
    type: string
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  list: true
- name: moments
  label: 生活剪影
  type: file
  path: _data/moments.json
  format: json
  fields:
  - *id001
  - *id002
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  list: true
- name: techniques
  label: 技術簡介
  type: file
  path: _data/techniques.json
  format: json
  fields:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  list: true
- name: members
  label: 實驗室成員
  type: file
  path: _data/members.json
  format: json
  fields:
  - name: name
    label: 姓名
    type: string
    required: true
  - name: role
    label: 身分
    type: select
    required: true
    options:
      values:
      - name: graduate
        label: 碩士生
      - name: undergraduate
        label: 專題生
  - name: description
    label: 中文介紹
    type: text
  - name: description_en
    label: 英文介紹
    type: text
  - name: image
    label: 照片
    type: image
  - *id007
  list: true
- name: publications
  label: 著作論文
  type: file
  path: _data/publications.json
  format: json
  fields:
  - name: title
    label: 論文題目
    type: string
    required: true
  - name: year
    label: 出版年
    type: number
    required: true
    options:
      min: 1900
      max: 2100
      step: 1
  - name: type
    label: 主持人的作者身分（可複選）
    type: select
    required: true
    options:
      multiple: true
      min: 1
      values:
      - name: first
        label: 第一作者 / First author
      - name: co-first
        label: 共同第一作者 / Co-first author
      - name: corresponding
        label: 通訊作者 / Corresponding author
      - name: co
        label: 共同作者 / Co-author
    description: 依論文正式標示選擇；同篇可以同時具有共同第一作者、通訊作者等身分。
  - name: journal
    label: 期刊與卷頁
    type: text
  - name: authors
    label: 作者名單
    type: text
  - name: doi
    label: DOI 完整網址
    type: string
    required: true
    pattern:
      regex: ^https://doi\.org/.+$
      message: 請填寫 https://doi.org/ 開頭的完整 DOI 網址。
  - *id007
  list: true

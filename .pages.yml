- name: members
  label: 實驗室成員
  type: file
  path: _data/members.json
  format: json
  fields:
  - name: name
    label: 姓名
    type: string
    required: true
  - name: role
    label: 身分
    type: select
    required: true
    options:
      values:
      - name: graduate
        label: 碩士生
      - name: undergraduate
        label: 專題生
  - name: description
    label: 中文介紹
    type: text
  - name: description_en
    label: 英文介紹
    type: text
  - name: image
    label: 照片
    type: image
    options:
      media: images
  - *id008
  list: true
- name: publications
  label: 著作論文
  type: file
  path: _data/publications.json
  format: json
  fields:
  - name: title
    label: 論文題目
    type: string
    required: true
  - name: year
    label: 出版年
    type: number
    required: true
    options:
      min: 1900
      max: 2100
      step: 1
  - name: type
    label: 主持人的作者身分（可複選）
    type: select
    required: true
    options:
      multiple: true
      min: 1
      values:
      - name: first
        label: 第一作者 / First author
      - name: co-first
        label: 共同第一作者 / Co-first author
      - name: corresponding
        label: 通訊作者 / Corresponding author
      - name: co-corresponding
        label: 共同通訊作者 / Co-corresponding author
      - name: co
        label: 共同作者 / Co-author
    description: 依論文正式標示選擇；同篇可以同時具有共同第一作者、通訊作者等身分。
  - name: journal
    label: 期刊與卷頁
    type: text
  - name: authors
    label: 作者名單
    type: text
  - name: doi
    label: DOI 完整網址
    type: string
    required: true
    pattern:
      regex: ^https://doi\.org/.+$
      message: 請填寫 https://doi.org/ 開頭的完整 DOI 網址。
  - *id008
  list: true

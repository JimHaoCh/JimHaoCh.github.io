name: Validate engineering resources and calculator
on:
  push:
    paths:
      - "_data/engineering_sections.json"
      - "_data/engineering_resources.json"
      - "resources/engineering.html"
      - "resources/microfluidic-calculator.html"
      - "resources/equipment-queue.html"
      - "resources/medical-resource-calculator.html"
      - "assets/js/equipment-queue-*.js"
      - "assets/css/equipment-queue.css"
      - "assets/js/food-shift-*.js"
      - "assets/css/food-shift.css"
      - "tests/food-shift.test.cjs"
      - "tests/equipment-queue.test.cjs"
      - "assets/js/microfluidic-physics.js"
      - "assets/js/microfluidic-calculator.js"
      - "_includes/engineering-reference-card.html"
      - "tests/engineering-resources.test.cjs"
      - ".github/workflows/test-engineering-resources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone JavaScript syntax
        run: |
          node --check assets/js/microfluidic-physics.js
          node --check assets/js/microfluidic-calculator.js
          node --check assets/js/equipment-queue-model.js
          node --check assets/js/equipment-queue-data.js
          node --check assets/js/equipment-queue-worker.js
          node --check assets/js/equipment-queue-ui.js
          node --check assets/js/food-shift-model.js
          node --check assets/js/food-shift-worker.js
          node --check assets/js/food-shift-ui.js
      - name: Verify physics, resource schema, and existing links
        run: node --test tests/engineering-resources.test.cjs tests/equipment-queue.test.cjs tests/food-shift.test.cjs


name: Sync medical laboratory national exam links
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-medlab-exams.yml"
      - "scripts/sync_medlab_exam.py"
  schedule:
    - cron: "25 18 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate official MOEX CSV
        run: python3 scripts/sync_medlab_exam.py
      - name: Commit verified exam link index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/moex_medlab.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MOEX medical laboratory exam link index"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No index changes"
          fi

<link rel="stylesheet" href="/lab-assistant.css?v=20261103-1">
<div class="lab-helper" id="lab-helper" data-open="false" hidden>
  <button class="lab-helper__launcher" type="button" aria-controls="lab-helper-panel" aria-expanded="false" aria-label="開啟實驗室小幫手 / Open lab guide">
    <span class="lab-helper__launcher-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 3v-3.15A3.5 3.5 0 0 1 4 12.5v-7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 8h8M8 11.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="18.5" cy="19" r="3.2" fill="#eeae6d" stroke="#fff" stroke-width="1.2"/><path d="M18.5 17.6v2.8M17.1 19h2.8" stroke="#183a65" stroke-width="1" stroke-linecap="round"/></svg></span>
    <span class="lab-helper__launcher-label">實驗室小幫手<small>Lab guide</small></span>
  </button>
  <section class="lab-helper__panel" id="lab-helper-panel" role="region" aria-label="實驗室小幫手 / Lab guide" hidden>
    <div class="lab-helper__top">
      <div class="lab-helper__identity"><span class="lab-helper__mark" aria-hidden="true">✦</span><div><strong class="lab-helper__title">實驗室小幫手</strong><span class="lab-helper__subtitle">BIOFLUMEN &amp; XENSOR LAB</span></div></div>
      <div class="lab-helper__tools"><button class="lab-helper__language" type="button" aria-label="Switch language to English">EN</button><button class="lab-helper__close" type="button" aria-label="關閉小幫手 / Close lab guide">×</button></div>
    </div>
    <div class="lab-helper__bar"><span class="lab-helper__status">●&nbsp; 研究・技術・合作資訊導覽</span><div class="lab-helper__bar-actions"><button class="lab-helper__home" type="button">主題</button><button class="lab-helper__reset" type="button">重新開始</button></div></div>
    <div class="lab-helper__messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
    <div class="lab-helper__bottom"><form class="lab-helper__form"><label for="lab-helper-input" class="lab-helper__sr-only">輸入想了解的問題</label><input id="lab-helper-input" type="text" maxlength="160" autocomplete="off" placeholder="輸入問題，例如：可以製作晶片嗎？"><button class="lab-helper__send" type="submit" aria-label="送出問題 / Send question"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4.5 21 12 4 19.5l2.5-7.5L4 4.5ZM6.5 12H20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg></button></form><p class="lab-helper__note">依網站公開資訊提供導覽，問題在瀏覽器內處理。</p></div>
  </section>
</div>
<script id="lab-helper-data" type="application/json">{{ site.data.lab_assistant | jsonify }}</script>
<script defer src="/lab-assistant.js?v=20261103-3"></script>
